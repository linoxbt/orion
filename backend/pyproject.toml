[project]
name = "orion-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "docusign-esign>=6.1.0",
    "fastapi>=0.140.13",
    "firebase-admin>=7.5.0",
    "google-adk>=2.5.0",
    "google-cloud-bigquery>=3.42.2",
    "google-cloud-documentai>=3.15.0",
    "google-cloud-firestore>=2.28.0",
    "google-cloud-secret-manager>=2.30.0",
    "google-cloud-storage>=3.13.0",
    "google-cloud-texttospeech>=2.31.0",
    "google-cloud-tasks>=2.23.0",
    "google-genai>=2.14.0",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.10.1",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "stripe>=15.3.1",
    "twilio>=9.10.9",
    "uvicorn[standard]>=0.52.0",
    "websockets>=15.0.1,<16",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
